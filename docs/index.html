<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contador Diferencial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
/* ── variáveis ─────────────────────────────────────────── */
/* Cores de hematologia: o vermelho do sangue nas ações, o azul-marinho do jaleco no texto, o branco clínico
   nas superfícies. O rosa da eosina e o violeta dos núcleos ficam só no esfregaço das lâminas. */
:root {
  --fundo: #f5f6f9;
  --bandeja: #eceef3;
  --superficie: #ffffff;
  --superficie-2: #f8f9fb;
  --texto: #1c2541;
  --suave: #5d6680;
  --borda: #e0e3ea;
  --primaria: #c62839;
  --primaria-forte: #a01d2c;
  --primaria-texto: #ffffff;
  --primaria-suave: #fde9eb;
  --eosina: #d6457a;
  --nucleo: #4b2c86;
  --vidro: rgba(255,255,255,.72);
  --vidro-borda: rgba(90,100,130,.28);
  --fosco: #eceef2;
  --fosco-risco: rgba(255,255,255,.5);
  --certo: #1c7543;
  --certo-fundo: #e3f3e8;
  --erro: #b42318;
  --erro-fundo: #fbe8e6;
  --aviso: #7a5100;
  --aviso-fundo: #fcf1d6;
  --raio: 12px;
  --raio-botao: 10px;
  --sombra: 0 1px 2px rgba(28,37,65,.06);
  --sombra-alta: 0 2px 4px rgba(28,37,65,.06), 0 14px 32px rgba(28,37,65,.14);
  --fonte: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fundo: #121520; --bandeja: #0c0e15;
    --superficie: #1b1f2c; --superficie-2: #232838;
    --texto: #eef0f6; --suave: #a3aac0; --borda: #2f3547;
    --primaria: #ff6b79; --primaria-forte: #ff929c;
    --primaria-texto: #2a070d; --primaria-suave: #3a1820;
    --eosina: #f07fa8; --nucleo: #b9a2f5;
    --vidro: rgba(255,255,255,.08); --vidro-borda: rgba(160,170,200,.22);
    --fosco: #262b3b; --fosco-risco: rgba(255,255,255,.04);
    --certo: #62d394; --certo-fundo: #142c1d;
    --erro: #ff8b7b; --erro-fundo: #3a1916;
    --aviso: #f1c35d; --aviso-fundo: #332811;
    --sombra: 0 1px 2px rgba(0,0,0,.35);
    --sombra-alta: 0 2px 4px rgba(0,0,0,.35), 0 16px 36px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
/* ── reset e base ──────────────────────────────────────── */
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--fundo);
  color: var(--texto);
  font: 16.5px/1.55 var(--fonte);
  -webkit-text-size-adjust: 100%;
}
main {
  max-width: 760px;
  margin: 0 auto;
  padding: max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right))
    max(72px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
}
main.largo { max-width: 1080px; }
h1 { font-size: 1.85rem; line-height: 1.15; letter-spacing: -.015em; font-weight: 800; font-stretch: 112%; margin: 6px 0 20px; }
h2 { font-size: 1.22rem; line-height: 1.25; letter-spacing: -.005em; font-weight: 720; font-stretch: 108%; margin: 0 0 10px; }
h3 { font-size: .95rem; font-weight: 700; margin: 0 0 6px; }
.so-leitor { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
p { margin: 0 0 12px; }
a { color: var(--primaria); }
.suave { color: var(--suave); }
.pequeno { font-size: .86rem; }
.carregando { color: var(--suave); text-align: center; padding: 64px 0; }
.icone { width: 1.5em; height: 1.5em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
/* ── cartões ───────────────────────────────────────────── */
.cartao {
  background: var(--superficie);
  border: 1px solid var(--borda);
  border-radius: var(--raio);
  box-shadow: var(--sombra);
  padding: 20px;
  margin: 0 0 18px;
}
.cartao.aviso { background: var(--aviso-fundo); color: var(--aviso); border-color: transparent; box-shadow: none; }
.cartao.aviso ul { margin: 8px 0; padding-left: 20px; }
/* ── botões ────────────────────────────────────────────── */
button, .botao {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 10px 20px;
  border: 1px solid var(--borda); border-radius: var(--raio-botao);
  background: var(--superficie); color: var(--texto);
  font: inherit; font-weight: 600; text-decoration: none; cursor: pointer;
  transition: transform .12s ease, box-shadow .15s ease, background-color .15s, border-color .15s;
}
button:hover:not(:disabled), .botao:hover { border-color: color-mix(in srgb, var(--primaria) 45%, var(--borda)); box-shadow: 0 2px 8px rgba(16,24,40,.08); }
button:active:not(:disabled), .botao:active { transform: translateY(1px) scale(.99); }
button.primario, .botao.primario {
  background: var(--primaria); border-color: var(--primaria); color: var(--primaria-texto); font-weight: 700;
}
button.primario:hover:not(:disabled), .botao.primario:hover { background: var(--primaria-forte); border-color: var(--primaria-forte); box-shadow: none; }
button.grande, .botao.grande { min-height: 56px; padding: 14px 28px; font-size: 1.08rem; }
button.discreto { min-height: 44px; border-color: transparent; background: none; color: var(--suave); font-size: .95rem; font-weight: 500; box-shadow: none; }
button.discreto:hover:not(:disabled) { color: var(--texto); background: var(--superficie-2); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, .botao:focus-visible { outline: 3px solid var(--primaria); outline-offset: 2px; }
kbd {
  display: inline-grid; place-items: center;
  min-width: 22px; height: 22px; padding: 0 5px;
  border: 1px solid var(--borda); border-bottom-width: 2px; border-radius: 6px;
  background: var(--superficie-2); color: var(--suave);
  font: 700 .72rem/1 ui-monospace, Consolas, monospace;
}
/* ── layout ────────────────────────────────────────────── */
.linha { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.linha.entre { justify-content: space-between; }
.acoes { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 18px; }
.barra-topo {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0 8px; gap: 12px;
}
.barra-topo a { text-decoration: none; padding: 8px 0; font-weight: 600; }
.barra-topo a.voltar {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border: 1px solid var(--borda); border-radius: 12px;
  color: var(--suave); font-size: .95rem;
}
.barra-topo a.voltar:hover { border-color: var(--primaria); color: var(--primaria); }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 12px 6px; border-bottom: 1px solid var(--borda); text-align: left; vertical-align: middle; font-size: .93rem; }
th { font-size: .8rem; color: var(--suave); font-weight: 650; }
td:last-child, th:last-child { text-align: right; white-space: nowrap; }
/* ── toast ─────────────────────────────────────────────── */
.toast {
  position: fixed; z-index: 90; left: 50%;
  bottom: max(24px, calc(env(safe-area-inset-bottom) + 8px));
  transform: translateX(-50%);
  max-width: min(560px, calc(100% - 32px));
  padding: 14px 20px; border-radius: 14px;
  background: var(--texto); color: var(--fundo);
  font-size: .95rem; font-weight: 500; box-shadow: var(--sombra-alta);
  animation: toast-sobe .25s ease-out both;
}
@keyframes toast-sobe { from { opacity: 0; transform: translate(-50%, 12px); } }
/* ── sobreposição ──────────────────────────────────────── */
body.sem-rolar { overflow: hidden; }
.sobreposicao {
  position: fixed; inset: 0; z-index: 80;
  display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 16px; overflow-y: auto;
  background: rgba(8,10,14,.86); backdrop-filter: blur(3px);
  color: #e8ebf0; animation: aparece .25s ease-out both;
}
@keyframes aparece { from { opacity: 0; } }
.sobreposicao button { border-color: #3a404b; background: rgba(255,255,255,.06); color: #e8ebf0; }
.sobreposicao button.discreto { border-color: transparent; background: none; color: #9aa3b2; }
.sobreposicao button.primario { border-color: var(--primaria); background: var(--primaria); color: var(--primaria-texto); }
/* ── bolinha ───────────────────────────────────────────── */
.bolinha { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 50%; }

/* ══════════════════════════════════════════════════════════
   CONTAGEM DE CÉLULAS
   ══════════════════════════════════════════════════════════ */
/* ── opções: a plaqueta do título ──────────────────────── */
.placa { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 20px; margin-bottom: 26px; border-bottom: 1px solid var(--borda); }
.placa-marca { display: flex; align-items: center; gap: 12px; }
.placa-marca svg { width: 38px; height: 38px; flex: none; }
.placa h1 { margin: 0; font-size: clamp(1.5rem, 3.4vw, 2.15rem); line-height: 1; font-weight: 820; font-stretch: 125%; letter-spacing: -.02em; }
.titulo-tela { margin: 0; font-size: 1.35rem; font-stretch: 112%; }
/* ── opções: a mesa (o laminário ao lado das opções) ──── */
.mesa {
  display: grid; grid-template-columns: 276px minmax(0, 1fr); grid-template-rows: auto 1fr;
  grid-template-areas: "autor principal" "perfis principal"; gap: 24px 32px; align-items: start;
}
.mesa-principal { grid-area: principal; min-width: 0; max-width: 700px; }
.laminario { grid-area: perfis; }
/* O cartão do autor: a ilustração, a assinatura e o LinkedIn, no primeiro lugar que se lê */
.autor { grid-area: autor; overflow: hidden; border: 1px solid var(--borda); border-radius: var(--raio); background: var(--superficie); box-shadow: var(--sombra); }
.autor-foto { display: block; width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: cover; object-position: top; background: var(--primaria-suave); }
.autor-texto { position: relative; display: grid; gap: 12px; padding: 14px 16px 16px; }
.autor-texto > * { position: relative; }
/* O átomo da tatuagem do autor, como marca d'água no fim do nome */
.autor-texto > .autor-atomo { position: absolute; top: 2px; right: 8px; width: 84px; height: 84px; color: var(--primaria); opacity: .2; pointer-events: none; }
.autor-assinatura { margin: 0; color: var(--suave); font-size: .86rem; line-height: 1.3; }
.autor-assinatura strong { display: block; color: var(--texto); font-size: 1.2rem; font-weight: 780; font-stretch: 108%; }
.autor-links { display: grid; gap: 8px; }
.autor-links .botao { min-height: 44px; padding: 8px 14px; justify-content: flex-start; font-size: .92rem; }
.autor-links svg { width: 22px; height: 22px; flex: none; }
.intro { max-width: 60ch; margin: 0 0 16px; font-size: 1.12rem; line-height: 1.5; }
.ferramentas { margin-bottom: 22px; }
.letra-miuda { max-width: 70ch; margin: 0; color: var(--suave); font-size: .84rem; }
/* O laminário: cada perfil é uma lâmina. A ponta fosca leva o nome; o esfregaço corado diz que o perfil
   está pronto, e a lâmina em branco, que ainda não tem células. */
.laminario {
  padding: 16px 14px 18px; border-radius: var(--raio);
  background: var(--bandeja); box-shadow: inset 0 1px 3px rgba(28,37,65,.1);
}
.laminario h2 { margin: 0 0 12px; font-size: 1.05rem; }
.laminario h3 { margin: 18px 0 2px; color: var(--suave); font-size: .86rem; font-weight: 650; }
.laminario-nota { margin: 0 0 10px; color: var(--suave); font-size: .78rem; line-height: 1.4; }
.laminas { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.lamina {
  display: grid; grid-template-columns: minmax(0, 1fr) 62px; min-height: 46px;
  border: 1px solid var(--vidro-borda); border-radius: 3px;
  background: var(--vidro); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 1px 1px rgba(28,37,65,.06);
}
.lamina-etiqueta {
  display: flex; flex-direction: column; justify-content: center; min-width: 0; padding: 5px 10px;
  border-right: 1px solid var(--vidro-borda);
  background: var(--fosco) repeating-linear-gradient(45deg, var(--fosco-risco) 0 1px, transparent 1px 4px);
}
.lamina-nome { font-size: .9rem; font-weight: 640; font-stretch: 88%; line-height: 1.2; }
.lamina-detalhe { color: var(--suave); font-size: .72rem; line-height: 1.25; }
.lamina:not(.pronta) .lamina-nome { color: color-mix(in srgb, var(--texto) 72%, var(--suave)); }
.lamina.pronta .lamina-esfregaco {
  background:
    radial-gradient(circle at 34% 38%, var(--nucleo) 0 1.7px, transparent 2.2px),
    radial-gradient(circle at 58% 64%, var(--nucleo) 0 1.4px, transparent 1.9px),
    radial-gradient(ellipse 78% 66% at 40% 50%, color-mix(in srgb, var(--eosina) 50%, transparent), color-mix(in srgb, var(--eosina) 18%, transparent) 58%, transparent 74%);
}
.lamina[aria-current="true"] { border-color: var(--primaria); box-shadow: 0 0 0 2px color-mix(in srgb, var(--primaria) 28%, transparent); }
button.lamina {
  width: 100%; gap: 0; padding: 0; justify-content: stretch; align-items: stretch;
  color: inherit; font-weight: 400; text-align: left;
  transition: border-color .15s, box-shadow .15s;
}
button.lamina:hover:not(:disabled) { border-color: var(--primaria); box-shadow: 0 0 0 1px var(--primaria); }
button.lamina:active:not(:disabled) { transform: none; }
button.lamina[aria-expanded="true"] { border-color: var(--eosina); box-shadow: 0 0 0 1px var(--eosina); }
.convite {
  margin: 6px 0 4px; padding: 12px 12px 14px;
  border: 1px solid var(--borda); border-left: 3px solid var(--eosina); border-radius: 8px;
  background: var(--superficie); font-size: .86rem; line-height: 1.45;
  animation: convite-abre .18s ease-out;
}
@keyframes convite-abre { from { opacity: 0; transform: translateY(-4px); } }
.convite p { margin: 0 0 10px; }
.convite .botao { width: 100%; min-height: 40px; padding: 8px 14px; font-size: .88rem; }
.convite-email { display: block; margin-top: 6px; color: var(--suave); font-size: .76rem; text-align: center; overflow-wrap: anywhere; }
@media (max-width: 880px) {
  .mesa { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-template-areas: "autor" "principal" "perfis"; gap: 22px; }
  /* No celular o autor vira uma faixa: a foto ao lado da assinatura */
  .autor { display: grid; grid-template-columns: 104px minmax(0, 1fr); align-items: center; }
  .autor-foto { height: 100%; min-height: 130px; aspect-ratio: auto; }
  .autor-texto { padding: 12px 14px; }
  .autor-texto > .autor-atomo { width: 64px; height: 64px; }
}
/* ── opções ────────────────────────────────────────────── */
.escolhas { display: flex; flex-wrap: wrap; gap: 10px; }
.escolha-item { flex-direction: column; align-items: flex-start; gap: 0; min-width: 84px; min-height: 58px; padding: 9px 18px; text-align: left; }
.escolha-item strong { font-variant-numeric: tabular-nums; }
.escolha-item span { font-size: .8rem; font-weight: 500; color: var(--suave); }
.escolha-item.ativa, .escolha-item.ativa:hover:not(:disabled) { border-color: var(--primaria); background: var(--primaria); color: var(--primaria-texto); box-shadow: none; }
.escolha-item.ativa span { color: color-mix(in srgb, var(--primaria-texto) 78%, transparent); }
.espaco-acima { margin-top: 22px; }
.largo-total { width: 100%; margin-top: 22px; }
.largo-total:disabled { opacity: .5; cursor: not-allowed; }
.quantas-manual { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 14px; font-weight: 600; }
.campo-quantas {
  width: 140px; min-height: 52px; padding: 0 14px;
  border: 1px solid var(--borda); border-radius: 12px;
  background: var(--superficie); color: var(--texto);
  font: inherit; font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums;
}
.campo-quantas:focus { outline: 3px solid color-mix(in srgb, var(--primaria) 55%, transparent); outline-offset: 0; border-color: var(--primaria); }
.erro-quantas { min-height: 1.4em; margin: 6px 0 0; color: var(--erro); font-size: .9rem; font-weight: 600; }
.idiomas { display: inline-flex; padding: 3px; border: 1px solid var(--borda); border-radius: 999px; background: var(--superficie); }
.idiomas button { min-height: 38px; padding: 0 14px; white-space: nowrap; border: 0; border-radius: 999px; background: none; color: var(--suave); font-size: .88rem; box-shadow: none; }
.idiomas button:hover:not(.ativo) { color: var(--texto); background: var(--superficie-2); box-shadow: none; }
.idiomas button.ativo { background: var(--primaria); color: var(--primaria-texto); }
.caixa-teclas { width: min(480px, 100%); padding: 22px 24px 18px; border-radius: 20px; background: var(--superficie); color: var(--texto); box-shadow: 0 24px 70px rgba(0,0,0,.45); }
.caixa-teclas h2 { margin: 0 0 6px; }
.caixa-teclas > p { margin: 0 0 14px; }
.sobreposicao.janela-teclas button { border-color: var(--borda); background: var(--superficie); color: var(--texto); }
.sobreposicao.janela-teclas button.discreto { border-color: transparent; background: none; color: var(--suave); }
.sobreposicao.janela-teclas button.primario { border-color: var(--primaria); background: var(--primaria); color: var(--primaria-texto); }
.lista-teclas { display: flex; flex-direction: column; margin-bottom: 10px; }
.linha-tecla { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--borda); }
.linha-tecla:last-child { border-bottom: 0; }
.linha-tecla .nome-celula { flex: 1; font-weight: 600; }
.sobreposicao.janela-teclas .botao-tecla { min-width: 76px; min-height: 44px; padding: 6px 14px; }
.botao-tecla kbd { min-width: 30px; height: 30px; font-size: .9rem; color: var(--texto); }
.sobreposicao.janela-teclas .botao-tecla.esperando { border-color: var(--primaria); background: var(--primaria-suave); color: var(--primaria); font-size: .88rem; animation: esperando-tecla 1s ease-in-out infinite alternate; }
@keyframes esperando-tecla { to { box-shadow: 0 0 0 4px color-mix(in srgb, var(--primaria) 25%, transparent); } }
.aviso-tecla { min-height: 1.4em; margin: 0 0 6px; color: var(--primaria); font-size: .9rem; font-weight: 600; }
.arvore { padding: 12px 16px; border-radius: 12px; background: var(--superficie-2); font-size: .9rem; }
/* ── esteira ───────────────────────────────────────────── */
.bancada-contagem { display: flex; flex-direction: column; gap: 18px; margin-top: 16px; }
.campo-contagem {
  --slot: 210px;
  position: relative; height: 280px; overflow: hidden; border-radius: 28px;
  background:
    radial-gradient(circle at 20% 30%, rgba(214,120,140,.18) 0 16px, transparent 17px),
    radial-gradient(circle at 70% 70%, rgba(214,120,140,.14) 0 14px, transparent 15px),
    radial-gradient(circle at 45% 85%, rgba(214,120,140,.12) 0 12px, transparent 13px),
    linear-gradient(180deg, #fbeef0, #f6e1e6);
  background-size: 120px 110px, 150px 130px, 90px 100px, auto;
  box-shadow: inset 0 0 0 1px rgba(150,90,110,.2), inset 0 10px 30px rgba(120,60,80,.12);
}
.fita-celulas { display: flex; height: 100%; transition: transform .38s cubic-bezier(.3,.7,.3,1); will-change: transform; }
.fita-celulas.sem-transicao { transition: none; }
.slot-celula { display: grid; flex: none; place-items: center; width: var(--slot); height: 100%; }
.slot-celula img {
  width: 150px; height: 150px; border-radius: 50%; object-fit: cover;
  background: rgba(255,255,255,.5); opacity: .45; transform: scale(.72);
  transition: transform .38s cubic-bezier(.3,.7,.3,1), opacity .3s, filter .3s;
  user-select: none;
}
.slot-celula img:not([src]) { visibility: hidden; }
.slot-celula.atual img { opacity: 1; transform: scale(1.38); box-shadow: 0 10px 30px rgba(80,30,50,.25); }
.slot-celula.passou img { opacity: .25; filter: grayscale(.4); }
.slot-celula.contada img { box-shadow: 0 0 0 5px var(--marca, transparent); }
.slot-celula.perdida img { box-shadow: 0 0 0 5px #9aa3b2; filter: grayscale(1); }
.ocular-contagem {
  position: absolute; top: 50%; left: 50%; width: 236px; height: 236px;
  border: 3px solid rgba(40,30,50,.55); border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 0 9999px rgba(40,20,35,.14); pointer-events: none;
}
.ocular-contagem::before, .ocular-contagem::after { content: ""; position: absolute; background: rgba(40,30,50,.4); }
.ocular-contagem::before { left: 50%; top: -14px; width: 2px; height: 22px; transform: translateX(-50%); }
.ocular-contagem::after { top: 50%; left: -14px; width: 22px; height: 2px; transform: translateY(-50%); }
.tempo-celula { position: absolute; left: 50%; bottom: 14px; width: 200px; height: 6px; overflow: hidden; border-radius: 3px; background: rgba(40,30,50,.15); transform: translateX(-50%); }

@keyframes anel-fim { 50% { transform: translate(-50%, -50%) scale(1.12); } }
/* ── pianinho ──────────────────────────────────────────── */
.pianinho {
  padding: 16px 18px 20px; border-radius: 24px;

@keyframes tecla-aperta { 35% { transform: translateY(0); box-shadow: 0 0 0 #b9b3a4, 0 2px 4px rgba(0,0,0,.35); } }

/* ── resultado ─────────────────────────────────────────── */

.coluna-barras { width: 34%; }

/* ── encaminhar para um amigo ──────────────────────────── */
/* O botão que chama atenção. A cada 4 s, juntos: um reflexo atravessa o botão, o halo vermelho pulsa e o
   aviãozinho dá uma decolada. Com o mouse em cima, o avião fica decolado e o halo, aceso. */
.botao-encaminhar {

  --halo-aceso: 0 0 0 7px color-mix(in srgb, var(--primaria) 22%, transparent), 0 8px 26px color-mix(in srgb, var(--primaria) 40%, transparent);
  position: relative; overflow: hidden; isolation: isolate;

@keyframes halo-encaminhar { 0%, 40%, 88%, 100% { box-shadow: var(--halo); } 62% { box-shadow: var(--halo-aceso); } }

  background: linear-gradient(100deg, transparent 10%, var(--brilho) 50%, transparent 90%);

}

/* ── rodapé ────────────────────────────────────────────── */
.rodape { display: flex; justify-content: center; align-items: center; gap: 6px; padding: 0 16px 28px; color: var(--suave); font-size: .86rem; }
.rodape:empty { display: none; }

/* ── histórico ─────────────────────────────────────────── */
.lista-historico { margin: 0; padding: 0; list-style: none; }
.lista-historico a {

.historico-nota.ok { color: var(--certo); }

.galeria-erros { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; }
.galeria-erros figure { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 0; text-align: center; }
.galeria-erros img { width: 112px; height: 112px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 3px var(--borda); }
.galeria-erros figcaption { display: flex; flex-direction: column; font-size: .85rem; line-height: 1.3; }

/* No celular, a rodada inteira cabe numa tela: a esteira em cima e as 14 teclas embaixo, em 4 colunas,
   com a contagem de cada uma num selo no canto da tecla. */
@media (max-width: 640px) {

  .nome-tecla { font-size: .8rem; font-stretch: 72%; line-height: 1.1; }

  /* as outras telas */
  .barra-topo { flex-wrap: wrap; }
  .escolhas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ferramentas > *, .acoes > * { flex: 1 1 auto; }

}
/* Telas baixas (iPhone SE e parecidos): a esteira encolhe para as teclas continuarem à vista */
@media (max-width: 640px) and (max-height: 720px) {

/* Sem teclado físico (celular, tablet sem teclado): somem as dicas de tecla e a configuração das teclas */
@media (hover: none) and (pointer: coarse) {

}
@media (prefers-reduced-motion: reduce) {
  .fita-celulas, .slot-celula img, .tampo-tecla { transition: none; }
  .tecla.apertada .tampo-tecla, .tecla.apertada .visor-tecla,

<body>
<main id="app"><p class="carregando">Carregando…</p></main>
<footer id="rodape" class="rodape"></footer>
<script>
"use strict";

// ══════════════════════════════════════════════════════════
// UTILITÁRIOS
// ══════════════════════════════════════════════════════════

const app = document.getElementById("app");

const SEM_ANIMACAO = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const pausa = (ms) => new Promise((ok) => setTimeout(ok, ms));
const faixaDaNota = (nota) => (nota >= 80 ? "ok" : nota >= 50 ? "medio" : "erro");

function el(tag, props, ...filhos) {
  const no = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined) continue;
    if (k.startsWith("on")) no.addEventListener(k.slice(2), v);
    else no.setAttribute(k, v);
  }
  no.append(...filhos.flat(Infinity).filter((f) => f != null));
  return no;
}

function tela(...nos) {
  app.replaceChildren(...nos.filter(Boolean));
}

function cabecalho(titulo, direita = null, volta = null) {
  const esq = el("div", { class: "linha", style: "gap: 6px" },
    volta ? el("a", { class: "voltar", href: volta.href }, `← ${volta.texto}`) : null,
    el("h1", { class: "titulo-tela" }, titulo));
  return el("div", { class: "barra-topo" }, esq, direita || el("span", {}));
}

function toast(texto) {
  const t = el("div", { class: "toast" }, texto);
  document.body.append(t);
  setTimeout(() => t.remove(), 3500);
}

function mostrarErro(e) {
  tela(el("div", { class: "cartao aviso", style: "margin-top: 32px" },
    el("strong", {}, "Erro ao carregar"), el("p", {}, String(e.message || e))));
}

function pct(acertos, total) {
  return total ? Math.round(100 * acertos / total) : 0;
}

const ICONES = {
  compartilhar: ["M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7", "M16 6l-4-4-4 4", "M12 2v13"],
  aviao: ["M21.5 2.5L10.6 13.4", "M21.5 2.5l-6.8 19-4.1-8.1-8.1-4.1z"],
  copiar: ["M9 9h11v11H9z", "M5 15H4V4h11v1"],
  certo: ["M5 12.5l4.5 4.5L19 7.5"],
  conversa: ["M20.5 11.6a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.5-4.3A8.5 8.5 0 1 1 20.5 11.6z"],
  site: ["M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z", "M3 12h18", "M12 3a14 14 0 0 1 0 18", "M12 3a14 14 0 0 0 0 18"],
  historico: ["M3 12a9 9 0 1 0 2.6-6.4", "M3 4v4h4", "M12 7v5l3 2"],
  teclado: ["M4 6h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z",
    "M6 10h.01", "M10 10h.01", "M14 10h.01", "M18 10h.01", "M8 14h8"],
};
function icone(nome) {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("aria-hidden", "true");
  svg.setAttribute("class", `icone icone-${nome}`);
  for (const d of ICONES[nome]) {
    const p = document.createElementNS(ns, "path");
    p.setAttribute("d", d);
    svg.append(p);
  }
  return svg;
}

function contar(no, ate, sufixo = "") {
  const inicio = Date.now();
  const DURACAO = 800;
  if (SEM_ANIMACAO) { no.textContent = `${Math.round(ate)}${sufixo}`; return; }
  const passo = () => {
    const progresso = Math.min(1, (Date.now() - inicio) / DURACAO);
    const ease = 1 - Math.pow(1 - progresso, 3);
    no.textContent = `${Math.round(ate * ease)}${sufixo}`;
    if (progresso < 1) requestAnimationFrame(passo);
  };
  requestAnimationFrame(passo);
}

let aoSair = null;

function abrirSobreposicao(classe, rotulo, caixa, teclas = () => false) {
  const anterior = document.activeElement;
  let aberta = true;
  const fundo = el("div", {
    class: `sobreposicao ${classe}`, role: "dialog", "aria-modal": "true", "aria-label": rotulo,
    onclick: (e) => { if (e.target === fundo) fechar(); },
  }, caixa);
  function aoTecla(e) {
    if (e.key === "Escape") fechar();
    else if (!teclas(e)) return;
    e.preventDefault(); e.stopPropagation();
  }
  function fechar() {
    if (!aberta) return;
    aberta = false;
    fundo.remove();
    document.removeEventListener("keydown", aoTecla, true);
    document.body.classList.remove("sem-rolar");
    if (anterior?.isConnected) anterior.focus({ preventScroll: true });
  }
  document.addEventListener("keydown", aoTecla, true);
  document.body.classList.add("sem-rolar");
  document.body.append(fundo);
  aoSair = fechar;
  return fechar;
}

// ══════════════════════════════════════════════════════════
// LÓGICA LOCAL (portada do Python)
// ══════════════════════════════════════════════════════════

let _banco = null; // carregado uma vez, reutilizado

async function carregarBanco() {
  if (_banco) return _banco;
  // "no-cache": o navegador sempre confere se o banco mudou (senão a página nova pode vir com o banco velho)
  const resp = await fetch("banco.json", { cache: "no-cache" });
  if (!resp.ok) throw new Error(`banco.json: ${resp.status} ${resp.statusText}`);
  _banco = await resp.json();
  return _banco;
}

function _faixaEmCelulas(referencia, n) {
  const [minPct, maxPct] = referencia;
  const minF = minPct * n / 100;
  const maxF = maxPct * n / 100;
  const justa = [Math.ceil(minF - 1e-9), Math.floor(maxF + 1e-9)];
  if (justa[0] <= justa[1]) return justa;
  return [Math.floor(minF + 1e-9), Math.ceil(maxF - 1e-9)];
}

function _randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function _shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// As células de uma rodada normal: as que têm imagem e entram no diferencial. Se alguma tem
// faixa de referência, só as com faixa: as outras (blasto, mielócito…) ficam para os perfis de doença.
function tiposDaRodada(banco) {
  const comImagem = banco.tipos.filter((t) => t.imagens && !t.a_parte);
  const comFaixa = comImagem.filter((t) => t.referencia);
  return comFaixa.length ? comFaixa : comImagem;
}

function sortearRodadaLocal(banco, n) {
  const tipos = tiposDaRodada(banco);
  if (!tipos.length) return { celulas: [] };

  const comReferencia = tipos.every((t) => t.referencia);
  let escolhidos; // [tipo, ...]

  if (comReferencia) {
    const faixas = {};
    for (const t of tipos) faixas[t.nome] = _faixaEmCelulas(t.referencia, n);
    const ordem = _shuffle(tipos.map((t) => t.nome));
    const quantas = {};
    let sobra = n;
    for (let i = 0; i < ordem.length; i++) {
      const nome = ordem[i];
      const depois = ordem.slice(i + 1);
      const minLivre = sobra - depois.reduce((s, d) => s + faixas[d][1], 0);
      const maxLivre = sobra - depois.reduce((s, d) => s + faixas[d][0], 0);
      const min = Math.max(faixas[nome][0], minLivre);
      const max = Math.min(faixas[nome][1], maxLivre);
      quantas[nome] = _randInt(min, max);
      sobra -= quantas[nome];
    }
    escolhidos = tipos.flatMap((t) => Array(quantas[t.nome]).fill(t));
    _shuffle(escolhidos);
  } else {
    const pesos = tipos.map(() => Math.pow(Math.random(), 1.5) + 0.05);
    const total = pesos.reduce((s, p) => s + p, 0);
    escolhidos = [];
    for (let i = 0; i < n; i++) {
      let r = Math.random() * total, j = 0;
      while (j < tipos.length - 1 && r > pesos[j]) { r -= pesos[j]; j++; }
      escolhidos.push(tipos[j]);
    }
  }

  // Dentro de cada tipo: embaralha a lista de códigos e usa como fila circular.
  const filas = {};
  const rodada = [];
  for (const tipo of escolhidos) {
    if (!filas[tipo.nome]) filas[tipo.nome] = _shuffle([...tipo.codigos]);
    const fila = filas[tipo.nome];
    rodada.push(fila.pop() ?? tipo.codigos[0]);
  }

  const ext = Object.fromEntries(tipos.map((t) => [t.nome, t.ext]));
  return {
    celulas: rodada.map((cod) => ({
      codigo: cod,
      url: `celulas/${cod}${ext[banco.por_codigo[cod]] || ".jpg"}`,
    })),
  };
}

function corrigirContagemLocal(banco, respostas) {
  const nomes = banco.tipos.map((t) => t.nome);
  const itens = respostas.map((r) => {
    const real = banco.por_codigo[r.codigo];
    if (!real) throw new Error(`código desconhecido: ${r.codigo}`);
    if (r.contou !== null && !nomes.includes(r.contou)) throw new Error(`célula desconhecida: ${r.contou}`);
    return { codigo: r.codigo, real, contou: r.contou };
  });
  const total = itens.length;
  const aParte = new Set(banco.tipos.filter((t) => t.a_parte).map((t) => t.nome));
  const reais = {}, contados = {};
  for (const nome of nomes) { reais[nome] = 0; contados[nome] = 0; }
  for (const i of itens) { reais[i.real]++; if (i.contou) contados[i.contou]++; }
  // O diferencial é sobre os leucócitos: os reais da rodada e o que você contou como leucócito
  // (a que passou sem contar entra, como antes; a que você contou como eritroblasto, não)
  const leucocitosReais = itens.filter((i) => !aParte.has(i.real)).length;
  const leucocitosContados = itens.filter((i) => !aParte.has(i.contou)).length;
  const trocasMap = {};
  for (const i of itens) {
    if (i.contou && i.contou !== i.real) {
      const k = `${i.real}|||${i.contou}`;
      trocasMap[k] = (trocasMap[k] || 0) + 1;
    }
  }
  const pct2 = (k, de) => de ? Math.round(1000 * k / de) / 10 : 0;
  return {
    total,
    certas: itens.filter((i) => i.contou === i.real).length,
    nao_contadas: itens.filter((i) => i.contou === null).length,
    tabela: nomes
      .filter((n) => !aParte.has(n) && (reais[n] || contados[n]))
      .map((n) => ({ celula: n, real: reais[n], contado: contados[n],
        real_pct: pct2(reais[n], leucocitosReais), contado_pct: pct2(contados[n], leucocitosContados) })),
    // por 100 leucócitos, como o eritroblasto sai no laudo
    a_parte: nomes
      .filter((n) => aParte.has(n) && (reais[n] || contados[n]))
      .map((n) => ({ celula: n, real: pct2(reais[n], leucocitosReais), contado: pct2(contados[n], leucocitosContados) })),
    trocas: Object.entries(trocasMap)
      .map(([k, v]) => { const [a, b] = k.split("|||"); return { real: a, contou: b, vezes: v }; })
      .sort((a, b) => b.vezes - a.vezes),
    itens,
  };
}

function opcoesDaContagem() {
  const padrao = { n: 100, ritmo: "livre", som: true, idioma: "pt", teclas: {} };
  try {
    const salvo = JSON.parse(localStorage.getItem(CHAVE_CONTAGEM));
    if (salvo && typeof salvo === "object") return { ...padrao, ...salvo };
  } catch {}
  return padrao;
}

function guardarOpcoes(opcoes) {
  try { localStorage.setItem(CHAVE_CONTAGEM, JSON.stringify(opcoes)); } catch {}
}

function teclaValida(tecla) {
  return typeof tecla === "string" && tecla.length === 1;
}

function teclasDasCelulas(nomes, configuradas = {}) {
  const teclas = new Map();
  const usadas = new Set();
  for (const nome of nomes) {
    const tecla = configuradas[nome];
    if (teclaValida(tecla) && !usadas.has(tecla)) { teclas.set(nome, tecla); usadas.add(tecla); }
  }
  const livres = [...TECLAS_CONTAGEM].filter((k) => !usadas.has(k));
  for (const nome of nomes) if (!teclas.has(nome) && livres.length) teclas.set(nome, livres.shift());
  return new Map(nomes.filter((n) => teclas.has(n)).map((n) => [n, teclas.get(n)]));
}

function rotuloDaTecla(tecla) {
  return tecla === " " ? txt.espaco : tecla.toUpperCase();
}

function configurarTeclas(tipos, aoMudar) {
  const nomes = tipos.map((t) => t.nome);
  let teclas = teclasDasCelulas(nomes, opcoesDaContagem().teclas);
  let esperando = null;
  const aviso = el("p", { class: "aviso-tecla", role: "status" });

  const linhas = tipos.map((t, i) => {
    const botao = el("button", { type: "button", class: "botao-tecla",
      onclick: () => esperar(esperando === t.nome ? null : t.nome) });
    return { nome: t.nome, botao, linha: el("div", { class: "linha-tecla" },
      el("span", { class: "bolinha", style: `background: ${CORES_TECLA[i % CORES_TECLA.length]}` }),
      el("span", { class: "nome-celula" }, nomeDaCelula(t.nome)),
      botao) };
  });

  function desenhar() {
    for (const { nome, botao } of linhas) {
      const tecla = teclas.get(nome);
      const espera = esperando === nome;
      botao.classList.toggle("esperando", espera);
      botao.setAttribute("aria-label", espera ? txt.aperteUmaTecla : txt.trocarTecla(nomeDaCelula(nome), tecla ? rotuloDaTecla(tecla) : "—"));
      botao.replaceChildren(espera ? txt.aperteUmaTecla : el("kbd", {}, tecla ? rotuloDaTecla(tecla) : "—"));
    }
  }

  function esperar(nome) { esperando = nome; aviso.textContent = ""; desenhar(); }

  function guardar() {
    guardarOpcoes({ ...opcoesDaContagem(), teclas: Object.fromEntries(teclas) });
    desenhar(); aoMudar(teclas);
  }

  function aoTecla(e) {
    if (!esperando || e.ctrlKey || e.metaKey || e.altKey) return false;
    if (["Shift", "CapsLock", "AltGraph", "Dead"].includes(e.key)) return true;
    if (e.key === "Backspace") aviso.textContent = txt.backspaceReservado;
    else if (!teclaValida(e.key)) aviso.textContent = txt.teclaInvalida;
    else {
      const nova = e.key.toLowerCase();
      const antiga = teclas.get(esperando);
      const dono = [...teclas].find(([n, k]) => k === nova && n !== esperando)?.[0];
      if (dono) teclas.set(dono, antiga);
      teclas.set(esperando, nova);
      esperando = null;
      guardar();
      aviso.textContent = dono && antiga ? txt.trocou(nomeDaCelula(dono), rotuloDaTecla(antiga)) : "";
    }
    return true;
  }

  const fechar = abrirSobreposicao("janela-teclas", txt.teclasTitulo, el("div", { class: "caixa-teclas" },
    el("h2", {}, txt.teclasTitulo),
    el("p", {}, txt.teclasComo),
    el("div", { class: "lista-teclas" }, linhas.map((l) => l.linha)),
    aviso,
    el("p", { class: "suave pequeno" }, txt.teclasDica),
    el("div", { class: "linha entre" },
      el("button", { type: "button", class: "discreto",
        onclick: () => { teclas = teclasDasCelulas(nomes); esperando = null; aviso.textContent = ""; guardar(); } },
        txt.restaurar),
      el("button", { type: "button", class: "primario", onclick: () => fechar() }, txt.pronto))), aoTecla);
  desenhar();
  linhas[0].botao.focus();
}

function somDaContagem() {
  let ctx = null;
  const tocar = (freq, dur, vol, tipo = "sine", atraso = 0) => {
    ctx ??= new (window.AudioContext || window.webkitAudioContext)();
    const t = ctx.currentTime + atraso;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = tipo; osc.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  };
  return {
    clique: () => { tocar(1900, .03, .12, "square"); tocar(320, .05, .08, "triangle"); },
    erro: () => tocar(140, .12, .1, "sawtooth"),
    sino: () => { tocar(1318, 1.4, .18); tocar(1976, 1.1, .08, "sine", .01); tocar(1318, 1.2, .12, "sine", .28); },
  };
}

    const rotulo = nomeDaCelula(nome);
    const t = el("button", {
      type: "button", class: "tecla", style: `--tecla: ${CORES_TECLA[i % CORES_TECLA.length]}`,
      onmousedown: (e) => e.preventDefault(),
      onclick: () => contarCelula(nome),
    }, visor, el("span", { class: "tampo-tecla" },
      el("span", { class: `nome-tecla${rotulo.split(" ").some((p) => p.length > 12) ? " longo" : ""}` }, rotulo),
      teclasDoTeclado.has(nome) ? el("kbd", {}, rotuloDaTecla(teclasDoTeclado.get(nome))) : null));
    return { nome, tecla: t, visor };
  });
  const botaoSom = el("button", { type: "button", class: "discreto", onclick: alternarSom });
  const desfazer = el("button", { type: "button", class: "discreto", onclick: voltar, disabled: true },
    txt.desfazer, el("span", { class: "so-teclado" }, txt.desfazerTecla));

  app.classList.add("largo", "na-rodada");
  tela(
    el("div", { class: "barra-topo" },
      el("a", { class: "voltar", href: "#",
        onclick: (e) => { if (respostas.length && !confirm(txt.abandonar)) e.preventDefault(); else { e.preventDefault(); ir("#"); } } },
        `← ${txt.contagem}`),
      botaoSom),
    el("div", { class: "bancada-contagem" },
      campo,
      el("div", { class: "pianinho" },
        el("div", { class: "painel-pianinho" },
          el("div", { class: "total-pianinho" },
            el("span", { class: "rotulo-visor" }, txt.total),
            totalEl,
            el("span", { class: "rotulo-visor" }, txt.de(inteiro(leucocitos)))),
          el("div", { class: "linha" }, desfazer)),
        el("div", { class: "teclas" }, teclaEls.map((t) => t.tecla))),
      el("p", { class: "suave pequeno dica-contagem" },
        ritmo.segundos ? txt.dicaEsteira(txt.numero(ritmo.segundos)) : txt.dicaLivre)));

  function pintarSom() { botaoSom.textContent = comSom ? txt.somLigado : txt.somDesligado; }
  function alternarSom() {
    comSom = !comSom;
    guardarOpcoes({ ...opcoesDaContagem(), som: comSom });
    pintarSom();
  }

  function carregarVizinhas() {
    slots.forEach((slot, i) => {
      const img = slot.firstChild;
      const perto = i >= atual - 3 && i <= atual + 6;
      if (perto && !img.src) img.src = img.dataset.src;
      slot.classList.toggle("atual", i === atual);
      slot.classList.toggle("passou", i < atual);
    });
  }

  function posicionar() {
    const largura = slots[0].offsetWidth || 200;
    fita.style.transform = `translateX(${campo.clientWidth / 2 - largura / 2 - atual * largura}px)`;
    carregarVizinhas();
    totalEl.textContent = String(respostas.filter((r) => r !== null && !aParte.has(r)).length).padStart(3, "0");
    for (const t of teclaEls) t.visor.textContent = String(contagem.get(t.nome));
    desfazer.disabled = !respostas.length || terminou;
  }

  function iniciarRelogio() {
    clearTimeout(relogio);
    if (!ritmo.segundos || terminou) return;
    const barra = tempo.firstChild;
    barra.getAnimations().forEach((a) => a.cancel());
    barra.animate([{ transform: "scaleX(1)" }, { transform: "scaleX(0)" }],
      { duration: ritmo.segundos * 1000, easing: "linear", fill: "forwards" });
    relogio = setTimeout(() => avancar(null), ritmo.segundos * 1000);
  }

  function contarCelula(nome) {
    if (terminou) return;
    if (comSom) som.clique();
    const t = teclaEls.find((k) => k.nome === nome);
    t.tecla.classList.remove("apertada");
    void t.tecla.offsetWidth;
    t.tecla.classList.add("apertada");
    contagem.set(nome, contagem.get(nome) + 1);
    slots[atual].style.setProperty("--marca", t.tecla.style.getPropertyValue("--tecla"));
    slots[atual].classList.add("contada");
    avancar(nome);
  }

  function avancar(resposta) {
    if (terminou) return;
    respostas.push(resposta);
    if (resposta === null) slots[atual].classList.add("perdida");
    anotar();
    atual += 1;
    if (atual >= celulas.length) { fim(); return; }
    posicionar(); iniciarRelogio();
  }

  function voltar() {
    if (!respostas.length || terminou) return;
    const ultima = respostas.pop();
    if (ultima !== null) contagem.set(ultima, contagem.get(ultima) - 1);
    anotar();
    atual -= 1;
    slots[atual].classList.remove("contada", "perdida");
    posicionar(); iniciarRelogio();
  }

  function aoTecla(e) {
    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat || e.target.matches?.("input, select, textarea")) return;
    if (e.key === "Backspace") { e.preventDefault(); voltar(); return; }
    const nome = porTecla.get(e.key.toLowerCase());
    if (!nome) return;
    e.preventDefault(); contarCelula(nome);
  }

  function sair() {
    clearTimeout(relogio);
    document.removeEventListener("keydown", aoTecla);
    window.removeEventListener("resize", posicionar);
    if (terminou) return;
    // Saiu no meio: com alguma célula contada, a rodada entra no histórico como abandonada
    terminou = true;
    if (!respostas.length) { esquecerAndamento(); return; }
    guardarNoHistorico(registroDe(andamento, respostasEmIndices(), "abandonada"))
      .catch((erro) => toast(txt.naoGuardou(erro.message)))
      .finally(esquecerAndamento);
  }

  async function fim() {
    terminou = true;
    clearTimeout(relogio);
    posicionar();
    campo.classList.add("terminou");
    if (comSom) som.sino();
    let r;
    try {
      const entradas = celulas.map((c, i) => ({ codigo: c.codigo, contou: respostas[i] ?? null }));
      [r] = await Promise.all([
        Promise.resolve(corrigirContagemLocal(banco, entradas)),
        pausa(SEM_ANIMACAO ? 0 : 900),
      ]);
    } catch (erro) {
      toast(txt.naoDeuCerto(erro.message));
      return;
    }
    let registro = null;
    try { registro = await guardarNoHistorico(registroDe(andamento, respostasEmIndices(), "completa")); }
    catch (erro) { toast(txt.naoGuardou(erro.message)); }
    esquecerAndamento();
    if (!campo.isConnected) return;
    sair();
    resultadoDaContagem(r, celulas, tipos, { registro });
  }

  document.addEventListener("keydown", aoTecla);
  window.addEventListener("resize", posicionar);
  aoSair = sair;
  pintarSom();
  anotar();
  requestAnimationFrame(() => {
    fita.classList.add("sem-transicao");
    posicionar();
    requestAnimationFrame(() => fita.classList.remove("sem-transicao"));
    iniciarRelogio();
  });
}

// ── o resultado ───────────────────────────────────────────
// contexto: { registro } logo depois da rodada; { registro, doHistorico: true, problemas } ao rever uma do histórico
function resultadoDaContagem(r, celulas, tipos, contexto = {}) {
  const { registro = null, doHistorico = false, problemas = new Set() } = contexto;
  const opcoes = opcoesDaContagem();
  const urlMap = new Map(celulas.map((c) => [c.codigo, c.url]));
  const cor = new Map(tipos.map((t, i) => [t.nome, CORES_TECLA[i % CORES_TECLA.length]]));
  const nota = pct(r.certas, r.total);
  const placar = el("strong", {}, "0%");
  contar(placar, nota, "%");
  const erradas = r.itens.filter((i) => i.contou !== i.real);
  const maior = Math.max(1, ...r.tabela.map((l) => Math.max(l.real_pct, l.contado_pct)));
  const barra = (valor, classe, celula) => el("span", {
    class: `barra-contagem ${classe}`,
    style: `width: ${(100 * valor) / maior}%; --tecla: ${cor.get(celula)}`,
  });
  const dif = (l) => {
    const d = Math.round((l.contado_pct - l.real_pct) * 10) / 10;
    return el("span", { class: `diferenca${d === 0 ? " igual" : ""}` },
      d === 0 ? "=" : `${d > 0 ? "+" : ""}${txt.numero(d)}`);
  };
  const trocarIdioma = (idioma) => {
    guardarOpcoes({ ...opcoes, idioma });
    prepararIdioma({ idioma }, tipos);
    resultadoDaContagem(r, celulas, tipos, contexto);
  };
  const estado = registro && registro.estado !== "completa"
    ? el("p", { class: "cartao aviso" }, (registro.estado === "abandonada" ? txt.estadoAbandonada : txt.estadoInterrompida)(
      inteiro(registro.itens.length), inteiro(registro.n)))
    : null;

  app.classList.remove("largo", "na-rodada");
  tela(
    doHistorico
      ? cabecalho(txt.contagemDe(quandoFoi(registro.fim)), seletorDeIdioma(opcoes.idioma, trocarIdioma), { href: "#historico", texto: txt.historico })
      : cabecalho(txt.resultado, seletorDeIdioma(opcoes.idioma, trocarIdioma), { href: "#", texto: txt.contagem }),
    problemas.has("alterado") ? el("p", { class: "cartao alerta" }, txt.registroAlterado) : null,
    problemas.has("banco") ? el("p", { class: "cartao aviso" }, txt.naoBateComOBanco) : null,
    estado,
    el("section", { class: `cartao resultado-contagem ${faixaDaNota(nota)}` },
      el("div", { class: "placar-contagem" }, placar, el("span", {}, txt.contadasCerto)),
      el("p", {}, txt.certas(inteiro(r.certas), inteiro(r.total)) + (r.nao_contadas ? txt.semContar(r.nao_contadas) : "") + "."),
      el("table", { class: "tabela-contagem" },
        el("thead", {}, el("tr", {}, txt.colunas.map((c) => el("th", {}, c)))),
        el("tbody", {}, r.tabela.map((l) => el("tr", {},
          el("td", {}, el("span", { class: "bolinha", style: `background: ${cor.get(l.celula)}` }), " ", nomeDaCelula(l.celula)),
          el("td", {}, `${txt.numero(l.real_pct)}%`),
          el("td", {}, `${txt.numero(l.contado_pct)}%`),
          el("td", { class: "coluna-barras" }, barra(l.real_pct, "real", l.celula), barra(l.contado_pct, "contado", l.celula)),
          el("td", {}, dif(l)))))),
      el("p", { class: "suave pequeno legenda-barras" }, txt.legendaBarras)),
    r.a_parte.length ? el("section", { class: "cartao" },
      el("h2", {}, txt.aParte),
      el("p", { class: "suave pequeno" }, txt.aParteComo),
      el("ul", { class: "trocas" }, r.a_parte.map((l) => el("li", {},
        el("span", { class: "bolinha", style: `background: ${cor.get(l.celula)}` }),
        el("strong", {}, nomeDaCelula(l.celula)),
        el("span", {}, txt.porCem(txt.numero(l.real))),
        el("span", { class: "vezes" }, txt.contouPorCem(txt.numero(l.contado))))))) : null,
    r.trocas.length ? el("section", { class: "cartao" },
      el("h2", {}, txt.trocas),
      el("ul", { class: "trocas" }, r.trocas.map((t) => el("li", {},
        el("strong", {}, nomeDaCelula(t.real)), txt.contadoComo, el("strong", {}, nomeDaCelula(t.contou)),
        el("span", { class: "vezes" }, `${t.vezes}×`))))) : null,
    erradas.length ? el("section", { class: "cartao" },
      el("h2", {}, txt.erradas(erradas.length)),
      el("div", { class: "galeria-erros" }, erradas.map((i) => el("figure", {},
        el("img", { src: urlMap.get(i.codigo), alt: "", loading: "lazy" }),
        el("figcaption", {},
          el("strong", {}, nomeDaCelula(i.real)),
          el("span", {}, i.contou ? txt.voceContou(nomeDaCelula(i.contou)) : txt.passouSemContar)))))) : null,
    doHistorico
      ? el("div", { class: "acoes" }, el("a", { class: "botao primario grande", href: "#historico" }, `← ${txt.historico}`))
      : el("div", { class: "acoes" },
        el("button", { class: "primario grande", onclick: () => ir("#rodada") }, txt.contarDeNovo),
        el("button", { class: "grande", onclick: () => ir("#") }, txt.mudarOpcoes),
        el("a", { class: "botao grande", href: "#historico" }, icone("historico"), txt.verHistorico)));
  window.scrollTo(0, 0);
}

// ══════════════════════════════════════════════════════════
// HISTÓRICO
// ══════════════════════════════════════════════════════════
// Cada contagem terminada (ou abandonada no meio) entra no fim da lista e não sai mais: o contador não tem
// como editar nem apagar. Cada registro leva o SHA-256 do anterior, então mexer num registro à mão (pelo
// DevTools) ou tirar um do meio aparece como "alterada". Quem refaz os hashes de propósito não é pego:
// para isso, só guardando num servidor.

const CHAVE_HISTORICO = "contadordif.historico";
const CHAVE_ANDAMENTO = "contadordif.andamento";

function novoId() {
  return crypto.randomUUID ? crypto.randomUUID() : `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
}

function lerHistorico() {
  try {
    const lista = JSON.parse(localStorage.getItem(CHAVE_HISTORICO));
    return Array.isArray(lista) ? lista : [];
  } catch { return []; }
}

function esquecerAndamento() {
  try { localStorage.removeItem(CHAVE_ANDAMENTO); } catch {}
}

async function hashDoRegistro(r) {
  const texto = JSON.stringify([r.v, r.id, r.inicio, r.fim, r.estado, r.n, r.ritmo, r.teclas, r.a_parte, r.itens, r.anterior]);
  const bytes = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(texto));
  return [...new Uint8Array(bytes)].map((b) => b.toString(16).padStart(2, "0")).join("");
}

// itens: [código da imagem, índice da célula real, índice da tecla apertada ou -1] de cada célula que passou
function registroDe(andamento, respostas, estado) {
  return {
    v: 1, id: andamento.id, inicio: andamento.inicio, fim: new Date().toISOString(), estado,
    n: andamento.codigos.length, ritmo: andamento.ritmo, teclas: andamento.teclas, a_parte: andamento.a_parte,
    itens: respostas.map((contou, i) => [andamento.codigos[i], andamento.reais[i], contou]),
  };
}

async function guardarNoHistorico(registro) {
  const lista = lerHistorico();
  registro.anterior = lista.length ? lista[lista.length - 1].hash : "";
  registro.hash = await hashDoRegistro(registro);
  localStorage.setItem(CHAVE_HISTORICO, JSON.stringify([...lista, registro]));
  return registro;
}

// A página fechou no meio de uma rodada: o que foi contado entra como interrompida
async function guardarRodadaInterrompida() {
  let andamento = null;
  try { andamento = JSON.parse(localStorage.getItem(CHAVE_ANDAMENTO)); } catch {}
  if (!andamento) return;
  try {
    if (andamento.respostas?.length) await guardarNoHistorico(registroDe(andamento, andamento.respostas, "interrompida"));
  } finally {
    esquecerAndamento();
  }
}

// O resultado sai sempre das respostas guardadas, nunca de um placar guardado
function corrigirRegistro(reg) {
  const banco = {
    tipos: reg.teclas.map((nome) => ({ nome, a_parte: reg.a_parte.includes(nome) })),
    por_codigo: Object.fromEntries(reg.itens.map(([codigo, real]) => [codigo, reg.teclas[real]])),
  };
  return corrigirContagemLocal(banco, reg.itens.map(([codigo, , contou]) => ({ codigo, contou: contou < 0 ? null : reg.teclas[contou] })));
}

// Para cada registro, o que há de errado: "alterado" (hash ou encadeamento não batem) e "banco"
// (a célula real de alguma imagem não é a do banco de imagens atual)
async function verificarHistorico(lista, banco) {
  const problemas = [];
  let anterior = "";
  for (const reg of lista) {
    const p = new Set();
    try {
      if (reg.anterior !== anterior || reg.hash !== await hashDoRegistro(reg)) p.add("alterado");
      if (reg.itens.some(([codigo, real]) => banco.por_codigo[codigo] && banco.por_codigo[codigo] !== reg.teclas[real])) p.add("banco");
    } catch { p.add("alterado"); }
    problemas.push(p);
    anterior = reg?.hash;
  }
  return problemas;
}

function quandoFoi(iso) {
  return new Date(iso).toLocaleString(txt.local, { dateStyle: "short", timeStyle: "short" });
}

function urlsDoRegistro(reg, banco) {
  const ext = new Map(banco.tipos.map((t) => [t.nome, t.ext]));
  return reg.itens.map(([codigo, real]) => ({ codigo, url: `celulas/${codigo}${ext.get(reg.teclas[real]) || ".jpg"}` }));
}

// ── tela: a lista ─────────────────────────────────────────
async function telaHistorico() {
  const banco = await carregarBanco();
  const opcoes = opcoesDaContagem();
  prepararIdioma(opcoes, banco.tipos);
  const lista = lerHistorico();
  const problemas = await verificarHistorico(lista, banco);
  const trocarIdioma = (idioma) => { guardarOpcoes({ ...opcoesDaContagem(), idioma }); telaHistorico().catch(mostrarErro); };

  const linhas = [];
  const notasCompletas = [];
  lista.forEach((reg, i) => {
    let resumo = null;
    try { resumo = corrigirRegistro(reg); } catch { problemas[i].add("alterado"); }
    const alterado = problemas[i].has("alterado");
    const nota = resumo ? pct(resumo.certas, resumo.total) : null;
    if (reg.estado === "completa" && !alterado && nota !== null) notasCompletas.push(nota);
    let quando = txt.ilegivel, detalhe = "";
    try {
      quando = quandoFoi(reg.fim);
      const ritmo = txt.ritmos[reg.ritmo]?.[0] || reg.ritmo;
      detalhe = reg.estado === "completa" ? txt.linhaCompleta(inteiro(reg.n), ritmo) : txt.linhaParcial(inteiro(reg.itens.length), inteiro(reg.n));
    } catch {}
    linhas.push(el("li", {}, el("a", { href: `#historico/${encodeURIComponent(reg?.id ?? "")}` },
      el("span", { class: "historico-quando" }, quando),
      el("span", { class: "historico-detalhe" }, detalhe),
      txt.estados[reg?.estado] ? el("span", { class: "selo" }, txt.estados[reg.estado]) : null,
      alterado ? el("span", { class: "selo alterado" }, txt.alterada) : null,
      el("span", { class: `historico-nota ${nota === null ? "" : faixaDaNota(nota)}` }, nota === null ? "—" : `${nota}%`))));
  });
  linhas.reverse(); // a mais recente primeiro
  const media = notasCompletas.length ? Math.round(notasCompletas.reduce((s, n) => s + n, 0) / notasCompletas.length) : null;

  tela(
    cabecalho(txt.historico, seletorDeIdioma(opcoes.idioma, trocarIdioma), { href: "#", texto: txt.contagem }),
    problemas.some((p) => p.has("alterado")) ? el("p", { class: "cartao alerta" }, txt.historicoAlterado) : null,
    el("section", { class: "cartao" },
      el("p", { class: "suave pequeno" }, txt.historicoComo),
      lista.length
        ? [el("p", { style: "font-weight: 650" }, txt.resumoHistorico(lista.length, media)),
          el("ul", { class: "lista-historico" }, linhas)]
        : el("p", {}, txt.historicoVazio)));
}

// ── tela: uma contagem do histórico ───────────────────────
async function telaContagemDoHistorico(id) {
  const banco = await carregarBanco();
  const opcoes = opcoesDaContagem();
  prepararIdioma(opcoes, banco.tipos);
  const lista = lerHistorico();
  const i = lista.findIndex((reg) => reg?.id === id);
  if (i < 0) {
    tela(cabecalho(txt.historico, null, { href: "#historico", texto: txt.historico }),
      el("p", { class: "cartao aviso" }, txt.naoEncontrada));
    return;
  }
  const problemas = (await verificarHistorico(lista, banco))[i];
  const reg = lista[i];
  let r;
  try { r = corrigirRegistro(reg); } catch {
    tela(cabecalho(txt.historico, null, { href: "#historico", texto: txt.historico }),
      el("p", { class: "cartao alerta" }, txt.registroAlterado));
    return;
  }
  // As cores e os nomes seguem as teclas da época da contagem
  const tipos = reg.teclas.map((nome) => banco.tipos.find((t) => t.nome === nome) || { nome });
  resultadoDaContagem(r, urlsDoRegistro(reg, banco), tipos, { registro: reg, doHistorico: true, problemas });
}

// ══════════════════════════════════════════════════════════
// ROTEADOR
// ══════════════════════════════════════════════════════════
// A tela segue o endereço (#, #rodada, #historico, #historico/<id>), então o voltar do navegador e os
// links "← …" funcionam. ir() troca o endereço; se ele já é esse, redesenha a tela.

function rotear() {
  if (aoSair) { aoSair(); aoSair = null; }
  app.classList.remove("largo", "na-rodada");
  const rota = decodeURIComponent(location.hash.slice(1));
  let carregando;
  if (rota === "rodada") carregando = telaRodadaContagem();
  else if (rota === "historico") carregando = telaHistorico();
  else if (rota.startsWith("historico/")) carregando = telaContagemDoHistorico(rota.slice("historico/".length));
  else carregando = telaContagem();
  carregando.catch(mostrarErro);
}

function ir(rota) {
  if (location.hash === rota || (rota === "#" && !location.hash)) rotear();
  else location.hash = rota;
}

function iniciarRodada() {
  ir("#rodada");
}

window.addEventListener("hashchange", rotear);
guardarRodadaInterrompida().catch((erro) => toast(txt.naoGuardou(erro.message))).finally(rotear);
</script>
